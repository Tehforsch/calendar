[package]
name = "calendar"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.28", features = ["serde"] }
dirs = "6"
eyre = "0.6"
jiff = "0.2.35"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9.34"
tui-input = { version = "=0.14.0", default-features = false }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
insta = "1.48"
tempfile = "3.27"
